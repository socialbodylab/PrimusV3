<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radius Central</title>
<link rel="stylesheet" href="/css/style.css">
<script>
window.PAGE_CONFIG = {
    modes: ["audio", "cues", "cue-map", "marius", "log"],
    modeLabels: { audio: "Audio", cues: "Audio Cues", "cue-map": "Cue Map", marius: "Marius", log: "Net Log" },
};
</script>
<script defer src="/js/alpine.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/audio-panel.js"></script>
<script src="/js/audio-cues.js"></script>
<script src="/js/cue-map.js"></script>
<script src="/js/net-log.js"></script>
<script src="/js/marius.js"></script>
</head>
<body>

<!-- ==================== NAVBAR ==================== -->
<nav class="navbar">
    <div class="navbar-brand">Radius Central</div>
    <div class="navbar-tabs">
        <template x-data x-for="m in $store.app.modes">
            <div class="navbar-tab"
                 :class="{ active: $store.app.mode === m }"
                 @click="$store.app.setMode(m)"
                 x-text="$store.app.modeLabels[m]"></div>
        </template>
    </div>
    <div class="navbar-status" x-data>
        <div class="status-dot" :class="{ connected: $store.conn.anyConnected }"></div>
        <span x-text="$store.conn.devices.filter(d=>d.is_audio && d.connected).length + '/' + $store.conn.devices.filter(d=>d.is_audio).length + ' nodes'"></span>
    </div>
</nav>

<!-- ==================== MAIN ==================== -->
<div class="main-content" x-data>

    <!-- ──── SIDEBAR: Radius Nodes ──── -->
    <div class="sidebar">
        <div class="flex justify-between items-center mb-4">
            <span class="section-title" style="margin:0">Radius Nodes</span>
            <div class="btn-group">
                <button class="btn btn-sm" @click="$store.conn.connectAll()">All On</button>
                <button class="btn btn-sm" @click="$store.conn.disconnectAll()">All Off</button>
            </div>
        </div>

        <template x-for="item in $store.conn.devices.map((d,i) => ({...d, _di: i})).filter(d => d.is_audio)" :key="item._di">
            <div class="device-card" :class="{ 'device-connected': item.connected, 'device-static-ip': item.ip_mode === 'static' && !item.ip_config_pending }">
                <div class="device-header">
                    <template x-if="$store.conn.renamingDevice !== item._di">
                        <span class="device-name" x-text="item.name"
                              @click="$store.conn.startRename(item._di)"
                              :class="{ 'device-name-disabled': !$store.conn.canRenameDevice(item) }"
                              :title="$store.conn.renameHint(item)"></span>
                    </template>
                    <template x-if="$store.conn.renamingDevice === item._di">
                        <input class="device-rename-input" type="text" maxlength="17"
                               x-model="$store.conn.renameValue"
                               @keydown.enter="$store.conn.finishRename(item._di)"
                               @keydown.escape="$store.conn.cancelRename()"
                               @blur="$store.conn.finishRename(item._di)"
                               x-init="$nextTick(() => { $el.focus(); $el.select() })">
                    </template>
                    <div class="btn-group">
                        <button class="btn btn-sm" x-show="item.connected"
                                @click="api('POST', '/api/hello_device', { device: item._di, volume: $store.audio?.volume[item._di] ?? 80 })">Hello</button>
                        <button class="btn btn-sm btn-danger" @click="$store.conn.removeDevice(item._di)">&times;</button>
                    </div>
                </div>
                <div class="device-meta">
                    <button class="device-ip-button"
                            :class="{ active: $store.conn.ipConfigDevice === item._di }"
                            :disabled="!$store.conn.canConfigureIp(item)"
                            :title="$store.conn.ipConfigHint(item)"
                            @click="$store.conn.ipConfigDevice === item._di ? $store.conn.closeIpConfig() : $store.conn.openIpConfig(item._di)"
                            x-text="item.ip"></button>
                    <span class="device-network-badge"
                          :class="$store.conn.networkModeClass(item)"
                          :title="$store.conn.networkModeTitle(item)"
                          x-text="$store.conn.networkModeLabel(item)"></span>
                    <span class="audio-badge" title="V3.2 Audio Node">♪</span>
                    <span x-show="item.marius_connected"
                          class="audio-badge"
                          style="background:#1e4f6e;color:#67d4f8"
                          :title="'Marius: ' + (item.marius_puck || 'connected')">BLE</span>
                </div>
                <div class="device-ip-config" x-show="$store.conn.ipConfigDevice === item._di" x-cloak>
                    <div class="form-group compact">
                        <label class="form-label">Static IP</label>
                        <input class="form-input form-input-sm" type="text"
                               x-model="$store.conn.ipConfigIp" placeholder="192.168.8.150">
                    </div>
                    <div class="form-group compact">
                        <label class="form-label">Gateway</label>
                        <input class="form-input form-input-sm" type="text"
                               x-model="$store.conn.ipConfigGateway" placeholder="192.168.8.1">
                    </div>
                    <div class="form-group compact">
                        <label class="form-label">Subnet</label>
                        <input class="form-input form-input-sm" type="text"
                               x-model="$store.conn.ipConfigSubnet" placeholder="255.255.255.0">
                    </div>
                    <div class="btn-group" style="margin-top:4px">
                        <button class="btn btn-sm btn-primary" @click="$store.conn.setStaticIp(item._di)">Set Static IP</button>
                        <button class="btn btn-sm btn-danger" @click="$store.conn.revertDhcp(item._di)">Revert to DHCP</button>
                    </div>
                    <div class="device-ip-config-note" x-text="$store.conn.networkModeTitle(item)"></div>
                    <div class="text-sm text-muted" style="margin-top:4px">Device will reboot after change.</div>
                </div>
            </div>
        </template>

        <template x-if="$store.conn.devices.filter(d => d.is_audio).length === 0">
            <p class="text-muted text-sm" style="margin-top:8px">No Radius nodes found.</p>
        </template>

        <button class="btn btn-sm mt-2" style="width:100%"
                @click="$store.conn.discover()"
                :disabled="$store.conn.discovering">
            <span x-text="$store.conn.discovering ? 'Scanning...' : 'Discover Nodes'"></span>
        </button>

        <div class="mt-2" style="display:flex;gap:4px">
            <input type="text" class="input" placeholder="IP address"
                   x-model="$store.conn.manualIp"
                   @keydown.enter="$store.conn.addManualIp()"
                   style="flex:1;font-size:12px;padding:4px 6px">
            <button class="btn btn-sm"
                    @click="$store.conn.addManualIp()"
                    :disabled="!$store.conn.manualIp">Add</button>
        </div>

        <template x-if="$store.conn.discovered.filter(n => n.is_audio !== false).length > 0">
            <div class="mt-2">
                <div class="text-sm text-muted mb-2">Discovered:</div>
                <template x-for="node in $store.conn.discovered" :key="node.ip">
                    <div class="device-card" style="cursor:pointer" @click="$store.conn.addDiscovered(node)">
                        <div class="device-name" x-text="node.short_name || node.ip"></div>
                        <div class="device-ip" x-text="node.ip"></div>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- ──── AUDIO PANEL ──── -->
    <div class="panel" x-show="$store.app.mode === 'audio'" x-data="audioPanel">

        <div class="section-title">Radius Nodes</div>

        <template x-if="audioDevices.length === 0">
            <div class="empty-state">
                <div>No Radius nodes detected.</div>
                <div class="text-muted text-sm" style="margin-top:6px">Radius nodes run V3.6 firmware and identify as "Radius" during discovery.</div>
            </div>
        </template>

        <template x-for="dev in audioDevices" :key="dev.di">
            <div class="audio-node-card" x-init="initDevice(dev.di)">

                <div class="audio-node-header">
                    <span class="audio-node-name">
                        <span class="audio-badge">♪</span>
                        <span x-text="dev.name"></span>
                    </span>
                    <span class="device-ip" x-text="dev.ip"></span>
                </div>

                <div class="audio-transport">
                    <div class="btn-group">
                        <button class="btn btn-sm btn-danger" @click="stop(dev.di)">&#9632; Stop</button>
                        <button class="btn btn-sm" @click="pause(dev.di)">&#8214; Pause</button>
                    </div>
                    <div class="audio-vol-row">
                        <span class="text-muted" style="font-size:11px;white-space:nowrap">Vol</span>
                        <input type="range" class="audio-vol-slider" min="0" max="100"
                               :value="getVolume(dev.di)"
                               @input="onVolumeInput(dev.di, $event.target.value)">
                        <span class="text-muted" style="font-size:11px;width:26px;text-align:right"
                              x-text="getVolume(dev.di)"></span>
                    </div>
                </div>

                <div class="audio-now-playing" x-show="nowPlaying(dev.di)">
                    <span x-text="nowPlaying(dev.di)?.cmd === 'loop' ? '↺' : '▶'"></span>
                    <span x-text="nowPlaying(dev.di)?.file"></span>
                </div>

                <div class="audio-fm">

                    <div class="audio-fm-toolbar">
                        <div class="audio-fm-breadcrumb">
                            <span class="audio-fm-crumb" @click="navigateTo(dev.di, '/')">SD</span>
                            <template x-for="(seg, i) in breadcrumbs(dev.di)" :key="i">
                                <span class="audio-fm-crumb-seg">
                                    <span class="text-muted">/</span>
                                    <span class="audio-fm-crumb"
                                          @click="navigateTo(dev.di, crumbPath(dev.di, i))"
                                          x-text="seg"></span>
                                </span>
                            </template>
                            <span class="text-muted" style="font-size:11px;margin-left:4px"
                                  x-show="loading[dev.di]">…</span>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-sm" @click="startNewFolder(dev.di)">+ Folder</button>
                            <button class="btn btn-sm" @click="loadDir(dev.di)"
                                    :disabled="loading[dev.di]">↺</button>
                        </div>
                    </div>

                    <div class="audio-fm-list"
                         :class="{ 'drag-active': dragOver[dev.di] }"
                         @dragover.prevent="dragOver = {...dragOver, [dev.di]: true}"
                         @dragleave.prevent="dragOver = {...dragOver, [dev.di]: false}"
                         @drop.prevent="onDrop(dev.di, $event)">

                        <template x-if="newFolderMode[dev.di]">
                            <div class="audio-fm-row">
                                <span class="audio-fm-icon">📁</span>
                                <input class="audio-fm-rename-input"
                                       :id="'new-folder-input-' + dev.di"
                                       x-model="newFolderName[dev.di]"
                                       @keydown.enter="commitNewFolder(dev.di)"
                                       @keydown.escape="cancelNewFolder(dev.di)"
                                       placeholder="folder name">
                                <button class="btn btn-sm btn-primary" @click="commitNewFolder(dev.di)">✓</button>
                                <button class="btn btn-sm" @click="cancelNewFolder(dev.di)">✕</button>
                            </div>
                        </template>

                        <template x-if="loading[dev.di] && entries[dev.di] === undefined">
                            <div class="audio-fm-empty text-muted">Loading…</div>
                        </template>

                        <template x-if="!loading[dev.di] && entries[dev.di] && wavFiles(dev.di).length === 0 && !newFolderMode[dev.di]">
                            <div class="audio-fm-empty text-muted">No WAV files on SD card</div>
                        </template>

                        <template x-for="entry in wavFiles(dev.di)" :key="entry.name">
                            <div class="audio-fm-row"
                                 :class="{ 'fm-row-playing': !entry.is_dir && isPlaying(dev.di, entry.name) }">

                                <span class="audio-fm-icon"
                                      :class="{ 'icon-playing': !entry.is_dir && isPlaying(dev.di, entry.name) }"
                                      x-text="entryIcon(dev.di, entry)"></span>

                                <template x-if="!isRenaming(dev.di, entry.name)">
                                    <span class="audio-fm-name"
                                          :class="{ 'audio-fm-folder': entry.is_dir }"
                                          @click="entry.is_dir && navigateInto(dev.di, entry.name)"
                                          x-text="entry.name"></span>
                                </template>
                                <template x-if="isRenaming(dev.di, entry.name)">
                                    <input class="audio-fm-rename-input"
                                           :value="renaming[dev.di]?.value"
                                           @input="renaming = {...renaming, [dev.di]: {...renaming[dev.di], value: $event.target.value}}"
                                           @keydown.enter="commitRename(dev.di, entry.name)"
                                           @keydown.escape="cancelRename(dev.di)">
                                </template>

                                <span class="audio-fm-size text-muted"
                                      x-text="entry.is_dir ? '' : formatSize(entry.size)"></span>

                                <template x-if="!entry.is_dir && entry.name.toLowerCase().endsWith('.wav') && !isRenaming(dev.di, entry.name)">
                                    <div class="btn-group">
                                        <button class="btn btn-sm"
                                                :class="{ 'btn-primary': isPlaying(dev.di, entry.name) && !isLooping(dev.di, entry.name) }"
                                                @click="play(dev.di, entry.name, 'play')" title="Play">▶</button>
                                        <button class="btn btn-sm"
                                                :class="{ 'btn-primary': isLooping(dev.di, entry.name) }"
                                                @click="play(dev.di, entry.name, 'loop')" title="Loop">↺</button>
                                    </div>
                                </template>

                                <template x-if="!isRenaming(dev.di, entry.name)">
                                    <div class="btn-group">
                                        <button class="btn btn-sm" title="Rename"
                                                @click="startRename(dev.di, entry.name)">✏</button>
                                        <button class="btn btn-sm btn-danger" title="Delete"
                                                @click="deleteEntry(dev.di, entry)">✕</button>
                                    </div>
                                </template>

                                <template x-if="isRenaming(dev.di, entry.name)">
                                    <div class="btn-group">
                                        <button class="btn btn-sm btn-primary"
                                                @click="commitRename(dev.di, entry.name)">✓</button>
                                        <button class="btn btn-sm"
                                                @click="cancelRename(dev.di)">✕</button>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <div class="audio-fm-drop-hint" x-show="dragOver[dev.di]">
                            Drop to upload
                        </div>
                    </div>

                    <div class="audio-fm-dropzone"
                         :class="{ 'drag-active': dragOver[dev.di] }"
                         @click="triggerFileInput(dev.di)"
                         @dragover.prevent="dragOver = {...dragOver, [dev.di]: true}"
                         @dragleave.prevent="dragOver = {...dragOver, [dev.di]: false}"
                         @drop.prevent="onDrop(dev.di, $event)">
                        <input type="file" accept=".wav,.WAV" multiple
                               style="display:none" :id="'file-input-' + dev.di"
                               @change="onFileInput(dev.di, $event)">
                        <span x-text="dragOver[dev.di] ? 'Drop to upload' : '↑ Drop WAV files or click to upload'"></span>
                    </div>

                    <template x-if="uploadStatus[dev.di]">
                        <div class="audio-fm-upload-row">
                            <span class="audio-fm-upload-name" x-text="uploadStatus[dev.di].name"></span>
                            <div class="audio-fm-upload-bar">
                                <div class="audio-fm-upload-fill"
                                     :class="{ 'audio-fm-upload-sending': uploadStatus[dev.di].progress === null }"
                                     :style="'width:' + (uploadStatus[dev.di].progress ?? 100) + '%'"></div>
                            </div>
                            <span class="audio-fm-upload-pct"
                                  x-text="uploadStatus[dev.di].progress !== null ? uploadStatus[dev.di].progress + '%' : 'Sending…'"></span>
                        </div>
                    </template>

                </div>
            </div>
        </template>

    </div>

    <!-- ──── AUDIO CUES PANEL ──── -->
    <div class="panel" x-show="$store.app.mode === 'cues'" x-data="audioCues">

        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
                <span class="section-title" style="margin:0">Audio Cues</span>
                <span class="text-muted" style="font-size:11px"
                      title="OSC port for Radius Central and Radius devices">OSC :53001</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-sm" @click="addCue()">+ Cue</button>
                <button class="btn btn-sm" @click="exportCueSheet()">↓ Export</button>
                <button class="btn btn-sm" @click="triggerCueImport()">↑ Import</button>
                <button class="btn btn-sm" @click="rescan()" :disabled="rescanning"
                        :title="'Device inventory: ' + inventoryAgeLabel()"
                        x-text="rescanning ? '…' : '↺ Scan'"></button>
                <button class="btn btn-sm" @click="startPull()"
                        title="Download files from devices to project library">↓ Pull</button>
                <button class="btn btn-sm" @click="pushCueMaps()"
                        :disabled="pushingMaps"
                        :title="pushMapsResult || 'Push cue map JSON to each connected device SD card'"
                        x-text="pushingMaps ? 'Pushing…' : '↑ Cue Maps'"></button>
                <button class="btn btn-sm btn-primary" @click="startSync()">↑ Push</button>
            </div>
        </div>

        <div class="cues-header-cols">

            <div class="cues-col-box">
                <div class="flex justify-between items-center mb-2">
                    <span class="form-label" style="margin:0">Project Library</span>
                    <div class="flex items-center gap-2">
                        <span class="text-muted" style="font-size:10px"
                              x-text="'devices scanned: ' + inventoryAgeLabel()"
                              x-show="Object.keys(deviceInventory).length > 0"></span>
                        <button class="btn btn-sm" @click="triggerProjectImport()">+ WAV</button>
                    </div>
                </div>
                <template x-if="projectFiles.length === 0">
                    <p class="text-muted text-sm">No WAV files imported yet.</p>
                </template>
                <div class="cues-library-scroll">
                    <template x-for="f in projectFiles" :key="f.name">
                        <div class="cues-library-row">
                            <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
                                <span class="text-sm" x-text="f.name"></span>
                                <div class="flex items-center gap-1" x-show="(f.sources || []).length > 1">
                                    <template x-for="src in (f.sources || [])" :key="src">
                                        <span class="source-badge"
                                              :class="src === 'local' ? 'source-local' : 'source-device'"
                                              x-text="fileSourceLabel(src)"></span>
                                    </template>
                                </div>
                            </div>
                            <span class="text-muted" style="font-size:11px;white-space:nowrap" x-text="formatSize(f.size)"></span>
                            <button class="btn btn-sm btn-danger" @click="deleteProjectFile(f.name)">✕</button>
                        </div>
                    </template>
                </div>
            </div>

            <div class="cues-col-box">
                <div class="form-label mb-2">Radius Devices</div>
                <template x-if="audioDevices.length === 0">
                    <p class="text-muted text-sm">No Radius nodes connected.</p>
                </template>
                <template x-for="dev in audioDevices" :key="dev.ip">
                    <div class="cues-device-row">
                        <span class="audio-badge">♪</span>
                        <span class="text-sm" x-text="dev.name"></span>
                        <span class="device-ip" x-text="dev.ip"></span>
                        <span class="cues-dev-status"
                              :class="dev.connected ? 'cues-dev-online' : 'cues-dev-offline'"
                              x-text="dev.connected ? '●' : '○'"
                              :title="dev.connected ? 'connected' : 'disconnected'"></span>
                    </div>
                </template>
            </div>

        </div>

        <template x-if="cues.length === 0">
            <p class="text-muted text-sm mt-4">No cues yet. Click "+ Cue" to add one.</p>
        </template>

        <template x-for="(cue, idx) in sortedCues" :key="cue.number">
            <div class="cue-card">

                <div class="cue-card-header">
                    <div class="flex items-center gap-2">
                        <span class="form-label" style="margin:0;white-space:nowrap">Cue</span>
                        <input type="number" class="form-input" min="1" max="255" style="width:60px"
                               :value="cue.number"
                               @change="updateCueField(idx, 'number', parseInt($event.target.value) || 1)">
                        <span class="text-muted" style="font-size:11px;white-space:nowrap;font-family:monospace"
                              :title="'OSC address — send this from EOS or QLab to fire cue ' + cue.number"
                              x-text="'/cue/' + cue.number"></span>
                        <input type="text" class="form-input" placeholder="note…" style="flex:1"
                               :value="cue.note"
                               @input="updateCueField(idx, 'note', $event.target.value)">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-primary" @click="fireCue(idx)">▶ Fire</button>
                        <button class="btn btn-sm btn-danger" @click="removeCue(idx)">✕</button>
                    </div>
                </div>

                <template x-if="audioDevices.length === 0">
                    <p class="text-muted text-sm" style="padding:4px 0">No Radius devices.</p>
                </template>

                <template x-for="dev in audioDevices" :key="dev.ip">
                    <div class="cue-action-row"
                         :class="{ 'cue-action-inactive': !actionIsActive(idx, dev.ip) }">

                        <span class="cue-action-device"
                              :class="dev.connected ? '' : 'text-muted'"
                              x-text="dev.name"
                              :title="dev.connected ? dev.ip : dev.ip + ' (disconnected)'"></span>

                        <template x-if="fireStatusForDevice(cue.number, dev.ip)">
                            <span class="fire-result-badge"
                                  :class="fireStatusClass(fireStatusForDevice(cue.number, dev.ip))"
                                  :title="fireStatusForDevice(cue.number, dev.ip).reason || ''"
                                  x-text="fireStatusIcon(fireStatusForDevice(cue.number, dev.ip))"></span>
                        </template>
                        <template x-if="!fireStatusForDevice(cue.number, dev.ip) && !dev.connected">
                            <span class="fire-result-badge fire-skipped" title="disconnected">○</span>
                        </template>

                        <select class="form-select" style="width:80px"
                                :value="getAction(idx, dev.ip).cmd"
                                @change="setActionField(idx, dev.ip, 'cmd', $event.target.value)">
                            <option value="none">—</option>
                            <option value="play">Play</option>
                            <option value="loop">Loop</option>
                            <option value="stop">Stop</option>
                        </select>

                        <template x-if="['play','loop'].includes(getAction(idx, dev.ip).cmd)">
                            <select class="form-select" style="flex:1;min-width:120px"
                                    :value="getAction(idx, dev.ip).filename"
                                    @change="setActionField(idx, dev.ip, 'filename', $event.target.value)">
                                <option value="">— select file —</option>
                                <template x-for="f in projectFiles" :key="f.name">
                                    <option :value="f.name" x-text="f.name"></option>
                                </template>
                            </select>
                        </template>

                        <template x-if="['play','loop'].includes(getAction(idx, dev.ip).cmd)">
                            <div class="flex items-center gap-1">
                                <span class="text-muted" style="font-size:11px">Vol</span>
                                <input type="number" class="form-input" min="0" max="100" style="width:52px"
                                       :value="getAction(idx, dev.ip).volume"
                                       @input="setActionField(idx, dev.ip, 'volume', parseInt($event.target.value) || 0)">
                            </div>
                        </template>

                        <template x-if="['play','loop'].includes(getAction(idx, dev.ip).cmd)">
                            <div class="flex items-center gap-1">
                                <span class="text-muted" style="font-size:11px">Dur</span>
                                <input type="number" class="form-input" min="0" max="3600" style="width:60px"
                                       :value="getAction(idx, dev.ip).duration"
                                       @input="setActionField(idx, dev.ip, 'duration', parseInt($event.target.value) || 0)"
                                       placeholder="0=full">
                                <span class="text-muted" style="font-size:11px">s</span>
                            </div>
                        </template>

                    </div>
                </template>

            </div>
        </template>

        <!-- Push sync modal -->
        <template x-teleport="body">
            <div class="modal-overlay" x-show="syncModal" @click.self="closeSyncModal()" style="z-index:200">
                <div class="modal" style="max-width:600px;width:95vw">
                    <div class="modal-title">
                        <span x-text="syncStatusLabel()"></span>
                        <span class="text-muted text-sm" style="margin-left:12px"
                              x-text="syncSummary()"></span>
                    </div>
                    <template x-if="['planning','stopping'].includes(syncJob?.status) || (syncJob?.items || []).length === 0">
                        <p class="text-muted text-sm" style="padding:12px 0"
                           x-text="syncJob?.status === 'stopping' ? 'Stopping audio on devices…' : 'Checking devices…'"></p>
                    </template>
                    <div class="sync-item-list" x-show="(syncJob?.items || []).length > 0">
                        <template x-for="(item, i) in (syncJob?.items || [])" :key="i">
                            <div class="sync-item" :class="syncItemClass(item)">
                                <span class="sync-item-icon" x-text="syncItemIcon(item)"></span>
                                <div class="sync-item-info">
                                    <span class="sync-item-device" x-text="item.device_name || item.device_ip"></span>
                                    <template x-if="item.filename">
                                        <span class="sync-item-file" x-text="item.filename"></span>
                                    </template>
                                    <template x-if="item.error">
                                        <span class="sync-item-error" x-text="item.error"></span>
                                    </template>
                                </div>
                                <template x-if="item.status === 'uploading' && item.bytes_total > 0">
                                    <div class="sync-progress-bar">
                                        <div class="sync-progress-fill"
                                             :style="'width:' + syncProgress(item) + '%'"></div>
                                    </div>
                                </template>
                                <template x-if="item.status === 'uploading' && item.bytes_total > 0">
                                    <span class="sync-pct text-muted"
                                          x-text="syncProgress(item) + '%'"></span>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="modal-actions">
                        <button class="btn" @click="closeSyncModal()">Close</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Pull sync modal -->
        <template x-teleport="body">
            <div class="modal-overlay" x-show="pullModal" @click.self="closePullModal()" style="z-index:200">
                <div class="modal" style="max-width:640px;width:95vw">

                    <div class="modal-title">
                        <span x-text="pullStatusLabel()"></span>
                        <span class="text-muted text-sm" style="margin-left:12px"
                              x-text="pullSummary()"></span>
                    </div>

                    <!-- Planning / stopping -->
                    <template x-if="['planning','stopping'].includes(pullJob?.status) || (pullJob?.items || []).length === 0">
                        <p class="text-muted text-sm" style="padding:12px 0"
                           x-text="pullJob?.status === 'stopping' ? 'Stopping audio on devices…' : 'Scanning devices…'"></p>
                    </template>

                    <!-- Download progress -->
                    <div class="sync-item-list" x-show="(pullJob?.items || []).length > 0">
                        <template x-for="(item, i) in (pullJob?.items || [])" :key="i">
                            <div class="sync-item" :class="pullItemClass(item)">
                                <span class="sync-item-icon" x-text="pullItemIcon(item)"></span>
                                <div class="sync-item-info">
                                    <span class="sync-item-device" x-text="item.device_name || item.device_ip"></span>
                                    <template x-if="item.filename">
                                        <span class="sync-item-file" x-text="item.filename"></span>
                                    </template>
                                    <template x-if="item.error">
                                        <span class="sync-item-error" x-text="item.error"></span>
                                    </template>
                                </div>
                                <template x-if="item.status === 'downloading' && item.bytes_total > 0">
                                    <div class="sync-progress-bar">
                                        <div class="sync-progress-fill"
                                             :style="'width:' + pullProgress(item) + '%'"></div>
                                    </div>
                                </template>
                                <template x-if="item.status === 'downloading' && item.bytes_total > 0">
                                    <span class="sync-pct text-muted"
                                          x-text="pullProgress(item) + '%'"></span>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- Job errors -->
                    <template x-if="(pullJob?.errors || []).length > 0">
                        <div style="margin-top:12px">
                            <div class="form-label" style="color:var(--color-error)">Errors</div>
                            <template x-for="(err, i) in (pullJob?.errors || [])" :key="i">
                                <div class="sync-item sync-error" style="margin-bottom:4px">
                                    <span class="sync-item-icon">✗</span>
                                    <div class="sync-item-info">
                                        <span class="sync-item-device" x-text="err.device_name || err.device_ip || ''"></span>
                                        <span class="sync-item-error" x-text="err.error"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Conflict resolution -->
                    <template x-if="pullJob?.status === 'done' && (pullJob?.conflicts || []).length > 0">
                        <div style="margin-top:16px;border-top:1px solid var(--color-border);padding-top:16px">
                            <div class="flex justify-between items-center mb-3">
                                <span class="form-label" style="margin:0;color:var(--color-warning)">
                                    Conflicts — same filename, different content
                                </span>
                                <button class="btn btn-sm btn-primary"
                                        x-show="(pullJob?.conflicts || []).length > 1"
                                        @click="resolveAll()">Apply All</button>
                            </div>

                            <template x-for="conflict in (pullJob?.conflicts || [])" :key="conflict.filename">
                                <div class="conflict-card">
                                    <div class="conflict-filename" x-text="conflict.filename"></div>

                                    <template x-for="(group, gi) in conflict.groups" :key="group.checksum">
                                        <div class="conflict-group">
                                            <!-- Sources -->
                                            <div class="conflict-sources">
                                                <template x-for="src in group.sources" :key="(src.type||'') + (src.device_ip||'')">
                                                    <span class="source-badge"
                                                          :class="src.type === 'local' ? 'source-local' : 'source-device'"
                                                          x-text="src.type === 'local' ? 'Local' : (src.device_name || src.device_ip)"></span>
                                                </template>
                                                <span class="text-muted" style="font-size:11px" x-text="formatSize(group.size)"></span>
                                                <span class="checksum-short text-muted"
                                                      x-text="checksumShort(group.checksum)"
                                                      :title="group.checksum"></span>
                                            </div>
                                            <!-- Action -->
                                            <div class="conflict-action">
                                                <select class="form-select" style="width:90px;font-size:12px"
                                                        :value="resolutionFor(conflict.filename, group.checksum).action"
                                                        @change="setResolutionAction(conflict.filename, group.checksum, $event.target.value)">
                                                    <option value="save">Save as</option>
                                                    <option value="discard">Discard</option>
                                                </select>
                                                <template x-if="resolutionFor(conflict.filename, group.checksum).action === 'save'">
                                                    <input type="text" class="form-input" style="flex:1;font-size:12px"
                                                           :value="resolutionFor(conflict.filename, group.checksum).save_as || group.suggested_name"
                                                           @input="setResolutionSaveAs(conflict.filename, group.checksum, $event.target.value)"
                                                           placeholder="filename.wav">
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <div style="display:flex;justify-content:flex-end;margin-top:8px">
                                        <button class="btn btn-sm btn-primary"
                                                @click="resolveConflict(conflict.filename)">Apply</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <div class="modal-actions">
                        <button class="btn" @click="closePullModal()">Close</button>
                    </div>
                </div>
            </div>
        </template>

    </div><!-- /.Audio Cues panel -->

    <!-- ──── CUE MAP PANEL ──── -->
    <div class="panel" x-show="$store.app.mode === 'cue-map'" x-data="cueMap()">

        <div class="flex justify-between items-center mb-4">
            <span class="section-title" style="margin:0">Cue Map</span>
            <div class="btn-group">
                <button class="btn btn-sm" @click="addRow()" :disabled="deviceIdx === null">+ Row</button>
                <button class="btn btn-sm btn-primary" @click="save()"
                        :disabled="deviceIdx === null || saving"
                        x-text="saving ? 'Saving…' : 'Save to SD'"></button>
            </div>
        </div>

        <!-- Device selector -->
        <div class="form-group mb-4">
            <label class="form-label">Radius Node</label>
            <select class="form-select" style="max-width:280px"
                    @change="selectDevice($event.target.value === '' ? null : parseInt($event.target.value))">
                <option value="" disabled :selected="deviceIdx === null">— select a node —</option>
                <template x-for="dev in audioDevices" :key="dev._di">
                    <option :value="dev._di" :selected="dev._di === deviceIdx"
                            x-text="dev.name + ' (' + dev.ip + ')'"></option>
                </template>
            </select>
            <button class="btn btn-sm" style="margin-left:8px"
                    @click="load()" :disabled="deviceIdx === null || loading"
                    x-text="loading ? 'Loading…' : '↺ Reload'"></button>
        </div>

        <!-- Status messages -->
        <template x-if="error">
            <div class="text-sm" style="color:var(--danger);margin-bottom:8px" x-text="error"></div>
        </template>
        <template x-if="success">
            <div class="text-sm" style="color:var(--success,#4caf50);margin-bottom:8px" x-text="success"></div>
        </template>

        <!-- Empty state -->
        <template x-if="audioDevices.length === 0">
            <p class="text-muted text-sm">No Radius nodes connected.</p>
        </template>
        <template x-if="deviceIdx !== null && rows.length === 0 && !loading">
            <p class="text-muted text-sm">No cue entries found. Click "+ Row" to add one.</p>
        </template>

        <!-- Cue table -->
        <template x-if="rows.length > 0">
            <table class="cue-list">
                <thead>
                    <tr>
                        <th style="width:60px">Cue #</th>
                        <th style="width:90px">Cmd</th>
                        <th>File</th>
                        <th style="width:60px">Vol</th>
                        <th style="width:75px">Dur (s)</th>
                        <th style="width:80px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="(row, idx) in rows" :key="idx">
                        <tr class="cue-row">
                            <td>
                                <input type="number" class="form-input form-input-sm"
                                       x-model.number="row.number"
                                       min="1" max="255" style="width:50px">
                            </td>
                            <td>
                                <select class="form-select" x-model="row.cmd" style="width:85px">
                                    <option value="play">Play</option>
                                    <option value="loop">Loop</option>
                                    <option value="stop">Stop</option>
                                    <option value="volume">Volume</option>
                                </select>
                            </td>
                            <td>
                                <template x-if="needsFile(row.cmd) && deviceFiles.length > 0">
                                    <select class="form-select" x-model="row.file">
                                        <option value="">— select —</option>
                                        <template x-for="f in deviceFiles" :key="f">
                                            <option :value="f" x-text="f"></option>
                                        </template>
                                    </select>
                                </template>
                                <template x-if="needsFile(row.cmd) && deviceFiles.length === 0">
                                    <input type="text" class="form-input" x-model="row.file"
                                           placeholder="filename.wav">
                                </template>
                                <template x-if="!needsFile(row.cmd)">
                                    <span class="text-muted" style="font-size:11px;padding-left:4px">—</span>
                                </template>
                            </td>
                            <td>
                                <input type="number" class="form-input form-input-sm"
                                       :value="row.volume ?? ''"
                                       @input="row.volume = $event.target.value !== '' ? parseInt($event.target.value) : null"
                                       min="0" max="100" style="width:50px" placeholder="—">
                            </td>
                            <td>
                                <template x-if="needsFile(row.cmd)">
                                    <input type="number" class="form-input form-input-sm"
                                           x-model.number="row.duration"
                                           min="0" max="3600" style="width:55px"
                                           placeholder="0=full">
                                </template>
                                <template x-if="!needsFile(row.cmd)">
                                    <span class="text-muted" style="font-size:11px;padding-left:4px">—</span>
                                </template>
                            </td>
                            <td>
                                <div class="btn-group">
                                    <button class="btn btn-sm" @click="moveRow(idx, -1)"
                                            :disabled="idx === 0">^</button>
                                    <button class="btn btn-sm" @click="moveRow(idx, 1)"
                                            :disabled="idx === rows.length - 1">v</button>
                                    <button class="btn btn-sm btn-danger"
                                            @click="removeRow(idx)">&times;</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>

        <p class="text-muted text-sm" style="margin-top:12px">
            Vol blank = device current volume. Dur 0 = play full file. Max 64 cues. Changes take effect after device reboot.
        </p>

    </div><!-- /.Cue Map panel -->

    <!-- ──── NET LOG PANEL ──── -->
    <!-- ──── MARIUS PANEL ──── -->
    <div class="panel" x-show="$store.app.mode === 'marius'" x-data="mariusEditor()">

        <div class="flex justify-between items-center mb-4">
            <span class="section-title" style="margin:0">Marius BLE Editor</span>
            <div class="btn-group">
                <button class="btn btn-sm" @click="importJson()">↑ Import</button>
                <button class="btn btn-sm" @click="exportJson()">↓ Export</button>
            </div>
        </div>

        <!-- Status banner -->
        <template x-if="status">
            <div class="mb-3 px-3 py-2 rounded text-sm"
                 :class="status.ok === true ? 'bg-green-900 text-green-200' : status.ok === false ? 'bg-red-900 text-red-200' : 'bg-gray-800 text-gray-300'"
                 x-text="status.msg"></div>
        </template>

        <!-- Device selector -->
        <div class="form-group mb-4">
            <label class="form-label">Device</label>
            <div class="flex gap-2 items-center">
                <select class="form-input" x-model.number="deviceIdx"
                        :disabled="audioDevices.length === 0">
                    <template x-for="(d, i) in audioDevices" :key="d.ip">
                        <option :value="i" x-text="d.name + ' (' + d.ip + ')'"></option>
                    </template>
                </select>
                <button class="btn btn-sm btn-primary"
                        @click="loadFromDevice()"
                        :disabled="!selectedDevice">↓ Load</button>
                <button class="btn btn-sm btn-primary"
                        @click="saveToDevice()"
                        :disabled="!selectedDevice">↑ Save</button>
            </div>
            <template x-if="selectedDevice && selectedDevice.marius_connected">
                <div class="text-sm mt-1" style="color:#67d4f8">
                    BLE connected — <span x-text="selectedDevice.marius_puck"></span>
                </div>
            </template>
        </div>

        <!-- Puck name -->
        <div class="form-group mb-4">
            <label class="form-label">Puck Name (BLE advertised name)</label>
            <input class="form-input" type="text" x-model="puckName"
                   placeholder="Puck.js abc" maxlength="32">
        </div>

        <!-- Action list for one event -->
        <template x-for="event in ['press', 'release']">
            <div class="mb-5">
                <div class="flex justify-between items-center mb-2">
                    <span class="section-title" style="margin:0;text-transform:capitalize"
                          x-text="event + ' Actions'"></span>
                    <button class="btn btn-sm btn-primary" @click="addAction(event)">+ Add</button>
                </div>

                <template x-if="(event === 'press' ? pressActions : releaseActions).length === 0">
                    <p class="text-muted text-sm">No actions.</p>
                </template>

                <template x-for="(a, idx) in (event === 'press' ? pressActions : releaseActions)" :key="idx">
                    <div class="device-card mb-2" style="padding:10px">
                        <!-- Row header: type + move + remove -->
                        <div class="flex gap-2 items-center mb-2">
                            <select class="form-input form-input-sm" x-model="a.type" style="flex:1">
                                <option value="audio_play">Audio Play</option>
                                <option value="audio_stop">Audio Stop</option>
                                <option value="osc">OSC</option>
                                <option value="artnet_audio">Art-Net Audio</option>
                                <option value="artnet_dmx">Art-Net DMX</option>
                            </select>
                            <button class="btn btn-sm" @click="moveAction(event, idx, -1)" :disabled="idx===0">↑</button>
                            <button class="btn btn-sm" @click="moveAction(event, idx, 1)"
                                    :disabled="idx === (event==='press'?pressActions:releaseActions).length-1">↓</button>
                            <button class="btn btn-sm btn-danger" @click="removeAction(event, idx)">&times;</button>
                        </div>

                        <!-- Type-specific fields -->
                        <div class="grid gap-2" style="grid-template-columns:1fr 1fr">

                            <!-- File -->
                            <div class="form-group compact" x-show="needsFile(a)">
                                <label class="form-label">File</label>
                                <input class="form-input form-input-sm" type="text"
                                       x-model="a.file" placeholder="sound.wav">
                            </div>

                            <!-- Volume -->
                            <div class="form-group compact" x-show="needsVolume(a)">
                                <label class="form-label">Volume (0–100)</label>
                                <input class="form-input form-input-sm" type="number"
                                       x-model="a.volume" min="0" max="100" placeholder="device default">
                            </div>

                            <!-- Loop checkbox -->
                            <div class="form-group compact" x-show="needsLoop(a)">
                                <label class="flex items-center gap-1" style="cursor:pointer;font-size:12px;margin-top:16px">
                                    <input type="checkbox" x-model="a.loop">
                                    <span>Loop</span>
                                </label>
                            </div>

                            <!-- OSC address -->
                            <div class="form-group compact" x-show="needsOsc(a)">
                                <label class="form-label">Address</label>
                                <input class="form-input form-input-sm" type="text"
                                       x-model="a.osc_addr" placeholder="/cue/1">
                            </div>

                            <!-- Art-Net audio cmd -->
                            <div class="form-group compact" x-show="needsArtCmd(a)">
                                <label class="form-label">Cmd</label>
                                <select class="form-input form-input-sm" x-model.number="a.cmd">
                                    <option value="0">0 — Stop</option>
                                    <option value="1">1 — Play</option>
                                    <option value="2">2 — Loop</option>
                                    <option value="3">3 — Pause</option>
                                    <option value="4">4 — Volume</option>
                                    <option value="6">6 — Play Cue</option>
                                    <option value="7">7 — Loop Cue</option>
                                </select>
                            </div>

                            <!-- DMX fields -->
                            <div class="form-group compact" x-show="needsDmx(a)">
                                <label class="form-label">Universe</label>
                                <input class="form-input form-input-sm" type="number"
                                       x-model.number="a.universe" min="0" max="255">
                            </div>
                            <div class="form-group compact" x-show="needsDmx(a)">
                                <label class="form-label">Channel (1–512)</label>
                                <input class="form-input form-input-sm" type="number"
                                       x-model.number="a.channel" min="1" max="512">
                            </div>
                            <div class="form-group compact" x-show="needsDmx(a)">
                                <label class="form-label">Value (0–255)</label>
                                <input class="form-input form-input-sm" type="number"
                                       x-model.number="a.value" min="0" max="255">
                            </div>

                            <!-- target_ip (network actions) -->
                            <div class="form-group compact" x-show="hasTarget(a)">
                                <label class="form-label">Target IP (blank = sender)</label>
                                <input class="form-input form-input-sm" type="text"
                                       x-model="a.target_ip" placeholder="192.168.8.x">
                            </div>

                            <!-- target_port (OSC only) -->
                            <div class="form-group compact" x-show="needsOsc(a)">
                                <label class="form-label">Port (blank = 53001)</label>
                                <input class="form-input form-input-sm" type="number"
                                       x-model="a.target_port" placeholder="53001">
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

    </div><!-- /.Marius panel -->

    <div class="panel" x-show="$store.app.mode === 'log'" x-data="netLog">

        <div class="flex justify-between items-center mb-3">
            <span class="section-title" style="margin:0">Network Log</span>
            <div class="btn-group">
                <label class="flex items-center gap-1" style="cursor:pointer;font-size:12px">
                    <input type="checkbox" x-model="autoScroll">
                    <span>Auto-scroll</span>
                </label>
                <button class="btn btn-sm" @click="clear()">Clear</button>
                <button class="btn btn-sm" @click="download()">↓ Download</button>
            </div>
        </div>

        <div class="log-list" x-ref="logList">
            <template x-if="entries.length === 0">
                <p class="text-muted text-sm" style="padding:8px">No events logged yet.</p>
            </template>
            <template x-for="entry in entries" :key="entry.id">
                <div class="log-row">
                    <span class="log-time" x-text="formatTime(entry.ts)"></span>
                    <span class="log-dir" :class="dirClass(entry.dir)" x-text="entry.dir"></span>
                    <span class="log-type" :class="typeClass(entry.type)"
                          x-text="typeLabel(entry.type)"></span>
                    <span class="log-summary" x-text="entry.summary"></span>
                </div>
            </template>
        </div>

    </div><!-- /.Net Log panel -->

</div>

</body>
</html>
